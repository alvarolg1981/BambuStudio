name: Build BMCU (macOS arm64)

on:
  workflow_dispatch:
  push:
    branches:
      - 'bmcu-*'
    paths:
      - 'src/**'
      - 'version.inc'
      - 'resources/**'
      - '.github/workflows/build_bmcu_mac.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac_arm64:
    name: macOS arm64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: macos-15
      arch: arm64
      build-deps-only: false
    secrets: inherit
